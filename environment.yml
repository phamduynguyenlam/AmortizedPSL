name: tamo
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # CUDA 12.8 is required for RTX 50-series (Blackwell). The explicit local
      # version prevents pip from silently selecting the CPU-only PyPI wheel.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0+cu128
      - torchdata==0.11.0
      - torchrl==0.11.1
      - gpytorch==1.14
      - botorch==0.13.0
      - pyro-ppl==1.9.1
      - pymoo==0.6.1.6
      - scipy==1.14.1
      - numpy==2.0.2
      - pandas==2.2.3
      - h5py==3.15.1
      - einops==0.8.2
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - wandb==0.25.0
      - matplotlib==3.10.8
      - tqdm==4.67.3
      - sobol-seq==0.2.0
      - flatten-dict==0.4.2
      - python-dotenv==1.2.2
      - pytest==8.3.4
