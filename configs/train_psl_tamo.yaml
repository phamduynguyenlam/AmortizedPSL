defaults:
  - default
  - data
  - model
  - _self_

method:
  # Legacy filename; the algorithm is now named APSL.
  name: apsl

experiment:
  seed: 0
  mode: train
  model_name: APSL
  device: cuda
  expid: null
  resume: false
  override: false
  log_to_wandb: true

train:
  num_total_epochs: 400000
  num_burnin_epochs: 392000
  nc_burnin_ratio: 0.7
  lr1: 1e-3
  lr2: 4e-5
  optimizer_type: adam
  scheduler_type: cosine_with_warmup
  weight_decay: 1e-2
  num_warmup_steps: null
  num_workers: 2
  prefetch_factor: 2

loss:
  use_cumulative_rewards: true
  batch_standardize: true
  clip_rewards: true
  # PSL scalar/STCH prediction head coefficient.
  loss_weight: 0.5
  # REINFORCE policy-loss coefficient.
  policy_loss_weight: 1.0
  discount_factor: 0.99
  max_norm: 1.0

prediction:
  batch_size: 32
  nc: null
  min_nc: 2
  max_nc: 50
  read_cache: false

optimization:
  use_grid_sampling: false
  use_fixed_query_set: true
  use_factorized_policy: false
  use_time_budget: true
  use_curriculum: false
  batch_size: 4
  num_samples: 4
  num_query_points: 512
  num_initial_points: 100
  random_num_initial: false
  T: 100
  min_T: 100
  max_T: 100
  regret_type: norm_ratio
  dim_mask_gen_mode: full
  single_obs_x_dim: null
  single_obs_y_dim: null
  read_cache: false
  write_cache: false
  epsilon: 1.0
  use_logit_mask: true
  sampling_mode: full

scalarization:
  type: smooth_tchebycheff
  tau: 0.1
  ideal_point: -1.0

# Objective-wise GMM surrogate. It reuses the original TAMO predictor with
# true (x, y) history and is optimized only by its prediction NLL.
objective_prediction:
  # True objective-value prediction-head coefficient.
  loss_weight: 0.5

log:
  freq_log: 200
  freq_save: 500
  freq_save_extra_burnin: 25000
  freq_save_extra: 5000
  freq_log_grad: 1000

apsl:
  # Deterministic checkpointed head x=h(H, lambda), not a task-local MLP.
  loss_weight: 0.5
  num_train_preferences: 64
  num_policy_preferences: 256
  preference_method: dirichlet

model:
  max_x_dim: 7
  max_y_dim: 1
  dim_mlp: 64
  dim_attn: 64
  nhead: 4
  dropout: 0.0
  num_layers_backbone: 4
  num_layers_encoder: 4
  num_layers_decoder: 4
  ctx_prefix_encoder_layer: true
  dim_hidden: 128
  depth: 3
  num_components: 20
  use_ar: false
  std_min: 1e-3
  std_max: 1.0
  single_mlp: false
  use_missing_marker: false
