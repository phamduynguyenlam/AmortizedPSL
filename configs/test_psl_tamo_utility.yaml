defaults:
  - default
  - data
  - model
  - _self_

method:
  name: psl_tamo_utility

extra:
  ckpt_name: ckpt.tar
  suffix_segment: utility_psl_100plus100

experiment:
  seed: 0
  mode: test
  task: optimization
  model_name: PSL_TAMO_UTILITY
  device: cuda
  expid: utility_psl
  resume: true
  override: true
  log_to_wandb: false

data:
  function_name: dx2_dy2
  data_id: null
  scene: ship
  dim_scatter_mode: random_k
  sigma: 0.0
  max_x_dim: 4
  max_y_dim: 3

optimization:
  num_initial_points: 100
  T: 100
  min_T: 100
  max_T: 100
  batch_size: 1
  num_samples: 1
  regret_type: ratio
  use_grid_sampling: false
  use_fixed_query_set: false
  use_factorized_policy: false
  use_time_budget: false
  dim_mask_gen_mode: full
  single_obs_x_dim: null
  single_obs_y_dim: null
  read_cache: false
  write_cache: false
  epsilon: 0.0
  num_query_points: 1000
  use_logit_mask: false
  sampling_mode: full

scalarization:
  type: smooth_tchebycheff
  tau: 0.1
  ideal_point: observed_min

utility:
  beta: 0.5
  temperature: 1.0

psl:
  hidden_dim: 256
  depth: 3
  lr: 1e-3
  init_steps: 1000
  update_steps: 1000
  num_train_preferences: 10
  num_policy_preferences: 1000
  preference_method: dirichlet
  log_every: 1

model:
  max_x_dim: 4
  max_y_dim: 3
  dim_mlp: 64
  dim_attn: 64
  nhead: 4
  dropout: 0.0
  num_layers_backbone: 4
  num_layers_encoder: 4
  num_layers_decoder: 4
  ctx_prefix_encoder_layer: true
  dim_hidden: 128
  depth: 3
  num_components: 20
  use_ar: false
  std_min: 1e-3
  std_max: 1.0
  single_mlp: false
  use_missing_marker: false
