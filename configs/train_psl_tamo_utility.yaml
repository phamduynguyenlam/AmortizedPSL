defaults:
  - default
  - data
  - model
  - _self_

method:
  name: psl_tamo_utility

experiment:
  seed: 0
  mode: train
  model_name: PSL_TAMO_UTILITY
  device: cuda
  expid: null
  resume: false
  override: false
  log_to_wandb: true

# This checkpoint learns only the TAMO-style objective utility surrogate.
# h_phi is initialized and optimized per task at evaluation time.
train:
  num_total_epochs: 400000
  num_burnin_epochs: 400000
  nc_burnin_ratio: 0.7
  lr1: 1e-3
  lr2: 4e-5
  optimizer_type: adam
  scheduler_type: cosine_with_warmup
  weight_decay: 1e-2
  num_warmup_steps: null
  num_workers: 2
  prefetch_factor: 2

loss:
  use_cumulative_rewards: true
  batch_standardize: true
  clip_rewards: true
  loss_weight: 1.0
  policy_loss_weight: 0.0
  discount_factor: 0.99
  max_norm: 1.0

prediction:
  batch_size: 32
  nc: null
  min_nc: 2
  max_nc: 50
  read_cache: false

# Required by the shared train schema; no REINFORCE rollout is run for this
# method because utility NLL trains TAMO and expected STCH updates task-local h.
optimization:
  use_grid_sampling: false
  use_fixed_query_set: false
  use_factorized_policy: false
  use_time_budget: false
  batch_size: 1
  num_samples: 1
  num_query_points: 256
  num_initial_points: 10
  random_num_initial: false
  T: 1
  min_T: 1
  max_T: 1
  regret_type: norm_ratio
  dim_mask_gen_mode: full
  single_obs_x_dim: null
  single_obs_y_dim: null
  read_cache: false
  write_cache: false
  epsilon: 0.0
  use_curriculum: false
  use_logit_mask: false
  sampling_mode: full

scalarization:
  type: smooth_tchebycheff
  tau: 0.1
  ideal_point: observed_min

utility:
  # PSL paper's objective-wise LCB: mean - beta * std.
  beta: 0.5
  temperature: 1.0

# Original PSL-MOBO MLP: m -> 256 -> 256 -> d, Adam lr=1e-3,
# K=10 preferences per Monte-Carlo gradient step.
psl:
  hidden_dim: 256
  depth: 3
  lr: 1e-3
  init_steps: 1000
  update_steps: 1000
  num_train_preferences: 10
  num_policy_preferences: 1000
  preference_method: dirichlet

log:
  freq_log: 200
  freq_save: 500
  freq_save_extra_burnin: 25000
  freq_save_extra: 5000
  freq_log_grad: 1000

# Unlike scalar PSL-TAMO, max_y_dim is the true objective dimension.
model:
  max_x_dim: 4
  max_y_dim: 3
  dim_mlp: 64
  dim_attn: 64
  nhead: 4
  dropout: 0.0
  num_layers_backbone: 4
  num_layers_encoder: 4
  num_layers_decoder: 4
  ctx_prefix_encoder_layer: true
  dim_hidden: 128
  depth: 3
  num_components: 20
  use_ar: false
  std_min: 1e-3
  std_max: 1.0
  single_mlp: false
  use_missing_marker: false
